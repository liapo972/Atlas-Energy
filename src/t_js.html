// Sequentiel : une seule teinte, clair vers fonce.
const SEQ_L = ["#F7E8D2","#EFD0A0","#E2B36B","#D0913C","#B06F18"];
const SEQ_D = ["#3A2E1C","#5C4522","#87642A","#B4883A","#E0A44B"];
// Divergent : deux teintes, gris neutre au point milieu.
const DIV_L = ["#17636B","#8FB9BD","#DCDFDD","#E5B877","#B06F18"];
const DIV_D = ["#6FBAC4","#33707A","#3B4845","#8E6B2C","#E8AE55"];

const CCY = {EUR:"€/MWh", GBP:"£/MWh"};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const tip = document.getElementById("tip");

let group = "power";
let metric = "price";
let selected = null;
let live = null;
let news = null;
let view = "map";
let nTheme = "all";
let nCountry = "all";
let lang = "fr";

function t(){ return T[lang]; }
function m(){ return METRICS[metric]; }

function initLang(){
  const h = (location.hash || "").replace("#", "").toLowerCase();
  if (h === "en" || h === "fr") return h;
  return (navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr";
}

function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a === "dark") return true;
  if (a === "light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ramp(){
  if (m().scale === "div") return isDark() ? DIV_D : DIV_L;
  return isDark() ? SEQ_D : SEQ_L;
}

function unitOf(key, code){
  // Une valeur peut porter sa propre unite : ALSI bascule entre le send-out
  // (GWh/j) et un taux de remplissage (%) selon ce que les terminaux publient.
  if (live && live.metrics && live.metrics[key] && live.metrics[key][code]
      && live.metrics[key][code].unit){
    return live.metrics[key][code].unit;
  }
  if (key === "price"){
    let c = (META[code] && META[code].ccy) || "EUR";
    if (live && live.metrics && live.metrics.price && live.metrics.price[code]
        && live.metrics.price[code].currency){
      c = live.metrics.price[code].currency;
    }
    return CCY[c] || (c + "/MWh");
  }
  return METRICS[key].unit;
}

function valueOf(key, code){
  if (live){
    const src = (live.metrics || {})[key];
    if (src && src[code] && typeof src[code].value === "number") return src[code].value;
    return null;
  }
  const d = DEMO[code];
  if (!d || typeof d[key] !== "number") return null;
  return d[key];
}

function val(code){ return valueOf(metric, code); }

function values(){
  return Object.keys(META).map(val).filter(v => typeof v === "number");
}

function domain(){
  const vs = values();
  if (!vs.length) return [0, 0];
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (m().scale === "div"){
    const a = Math.max(Math.abs(lo), Math.abs(hi)) || 1;
    return [-a, a];
  }
  return [lo, hi];
}

function colorFor(code){
  const v = val(code);
  if (typeof v !== "number") return "var(--land)";
  const [lo, hi] = domain();
  const k = hi === lo ? 0.5 : (v - lo) / (hi - lo);
  const r = ramp();
  return r[Math.min(r.length - 1, Math.max(0, Math.floor(k * r.length)))];
}
