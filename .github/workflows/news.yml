name: Mise a jour du fil d'actualite

on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Agreger les titres
        run: python fetch_news.py

      - name: Commit si changement
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/news.json
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
