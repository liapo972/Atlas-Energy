name: Mise a jour quotidienne des donnees

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recuperer les donnees ouvertes
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          GIE_KEY: ${{ secrets.GIE_KEY }}
        run: python fetch_data.py

      - name: Reconstruire la page
        run: python build.py

      - name: Commit si changement
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/prices.json index.html
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          fi
