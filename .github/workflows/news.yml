name: Mise a jour du fil d'actualite

on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Les deux workflows ecrivent dans data/ : le meme groupe les empeche de
# tourner en meme temps, donc de se marcher dessus.
concurrency:
  group: atlas-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Agreger les titres
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          GIE_KEY: ${{ secrets.GIE_KEY }}
        run: python fetch_news.py

      - name: Commit et push
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/news.json data/last_run_news.txt
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push refuse, integration des commits distants (essai $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
