<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Carte interactive des marches europeens de l'electricite et du gaz, construite sur donnees ouvertes.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Atlas des marchés européens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F4F3;
  --surface:#FFFFFF;
  --surface-alt:#E7ECEA;
  --ink:#16211F;
  --muted:#5B6A68;
  --line:#D7DFDC;
  --line-strong:#BCC8C4;
  --accent:#A9640F;
  --accent-tint:#F8EDDB;
  --deep:#173F4A;
  --on-deep:#EEF3F2;
  --land:#DEE5E2;
  --land-line:#C6D1CD;
  --crit:#9E3527;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
</style>

<style>
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1716;
    --surface:#18211F;
    --surface-alt:#1E2926;
    --ink:#E7ECEA;
    --muted:#93A5A1;
    --line:#26322F;
    --line-strong:#3A4744;
    --accent:#E0A44B;
    --accent-tint:#2C2113;
    --deep:#9DC4CD;
    --on-deep:#0F1716;
    --land:#232E2B;
    --land-line:#33403C;
    --crit:#D2705F;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1716;
  --surface:#18211F;
  --surface-alt:#1E2926;
  --ink:#E7ECEA;
  --muted:#93A5A1;
  --line:#26322F;
  --line-strong:#3A4744;
  --accent:#E0A44B;
  --accent-tint:#2C2113;
  --deep:#9DC4CD;
  --on-deep:#0F1716;
  --land:#232E2B;
  --land-line:#33403C;
  --crit:#D2705F;
}
</style>

<style>
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-d);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:1400px;
  margin:0 auto;
  padding:1.5rem 1.25rem 3rem;
  display:flex;
  flex-direction:column;
  gap:1.1rem;
}
.eyebrow{
  font-family:var(--f-m);
  font-size:.66rem;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}
header.top{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:1rem;
  padding-bottom:1rem;
  border-bottom:2px solid var(--ink);
}
h1{
  font-weight:800;
  font-size:clamp(1.6rem,4vw,2.35rem);
  letter-spacing:-.025em;
  line-height:1;
  margin:.35rem 0 0;
}
.sub{
  color:var(--muted);
  font-size:.9rem;
  max-width:34rem;
  margin:.5rem 0 0;
}
.banner{
  display:flex;
  align-items:flex-start;
  gap:.7rem;
  background:var(--surface);
  border:1px solid var(--crit);
  border-left-width:4px;
  padding:.8rem 1rem;
  font-size:.86rem;
  color:var(--ink);
}
.banner b{color:var(--crit);font-family:var(--f-m);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-top:.15rem;}
.banner p{margin:0;max-width:60rem;}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
  align-items:center;
}
.seg{
  display:inline-flex;
  border:1px solid var(--line-strong);
  background:var(--surface);
}
.seg button{
  font-family:var(--f-m);
  font-size:.7rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.5rem .9rem;
  background:none;
  border:0;
  color:var(--muted);
  cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line-strong);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
</style>

<style>
section{display:flex;flex-direction:column;gap:1rem;}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.9rem 1.4rem;
  padding-top:.2rem;
}

.stage{
  display:grid;
  grid-template-columns:minmax(0,1fr) 24rem;
  gap:1.2rem;
  align-items:start;
}
@media (max-width:64rem){
  .stage{grid-template-columns:minmax(0,1fr);}
}

.mapbox{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  padding:.5rem;
}
svg.map{display:block;width:100%;height:auto;}
svg.map path{
  stroke:var(--land-line);
  stroke-width:.6;
  stroke-linejoin:round;
  fill:var(--land);
}
svg.map path.live{cursor:pointer;}
svg.map path.live:hover,svg.map path.live:focus{
  stroke:var(--ink);
  stroke-width:1.6;
  outline:none;
}
svg.map path.sel{stroke:var(--ink);stroke-width:2;}

.tip{
  position:absolute;
  pointer-events:none;
  background:var(--ink);
  color:var(--bg);
  padding:.55rem .7rem;
  font-size:.78rem;
  line-height:1.35;
  max-width:15rem;
  opacity:0;
  transform:translate(-50%,-115%);
  transition:opacity .12s;
  z-index:5;
}
.tip.on{opacity:1;}
.tip .t-name{font-weight:700;letter-spacing:-.01em;}
.tip .t-row{font-family:var(--f-m);font-size:.72rem;opacity:.85;font-variant-numeric:tabular-nums;}

.legend{
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:.6rem .4rem .2rem;
  flex-wrap:wrap;
}
.ramp{display:flex;}
.ramp i{width:26px;height:9px;display:block;}
.legend span{font-family:var(--f-m);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;}

/* bande de detail sous la carte : on utilise la largeur, pas la hauteur */
.detail{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));
  gap:1.2rem;
  align-items:start;
  border-top:2px solid var(--ink);
  padding-top:1.3rem;
  margin-top:.3rem;
}
.detail > .block{
  background:var(--surface);
  border:1px solid var(--line);
  padding:1.1rem 1.2rem;
  gap:.7rem;
}
</style>

<style>
aside.panel{
  background:var(--surface);
  border:1px solid var(--line);
  position:sticky;
  top:1rem;
  display:flex;
  flex-direction:column;
}
.p-head{
  padding:1rem 1.1rem .9rem;
  border-bottom:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:.15rem;
}
.p-head h2{
  font-size:1.25rem;
  font-weight:700;
  letter-spacing:-.02em;
  margin:0;
}
.p-body{
  padding:1rem 1.1rem 1.2rem;
  display:flex;
  flex-direction:column;
  gap:1.1rem;
}
.block{display:flex;flex-direction:column;gap:.45rem;}
.block h3{
  font-family:var(--f-m);
  font-size:.64rem;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0;
}
.kv{display:flex;justify-content:space-between;gap:.8rem;font-size:.85rem;border-bottom:1px dotted var(--line-strong);padding-bottom:.3rem;}
.kv dt{color:var(--muted);}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}
.big{
  display:flex;
  align-items:baseline;
  gap:.4rem;
  font-variant-numeric:tabular-nums;
}
.big b{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.big span{font-family:var(--f-m);font-size:.72rem;color:var(--muted);}
.demo-tag{
  align-self:flex-start;
  font-family:var(--f-m);
  font-size:.6rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--crit);
  border:1px solid var(--crit);
  padding:.15rem .4rem;
}
.links{display:flex;flex-direction:column;gap:.35rem;}
.links a{
  font-size:.83rem;
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid var(--line-strong);
  padding-bottom:.3rem;
  display:flex;
  justify-content:space-between;
  gap:.5rem;
}
.links a:hover{color:var(--accent);border-color:var(--accent);}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.links a em{font-family:var(--f-m);font-size:.66rem;color:var(--muted);font-style:normal;}
.empty{color:var(--muted);font-size:.86rem;}
footer{
  border-top:1px solid var(--line);
  padding-top:1rem;
  font-family:var(--f-m);
  font-size:.7rem;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:.4rem;
}
</style>

<style>
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem;}
.notes li{font-size:.85rem;line-height:1.45;padding-left:.85rem;position:relative;}
.notes li::before{content:"";position:absolute;left:0;top:.55em;width:4px;height:4px;background:var(--accent);}
.notes b{font-weight:700;}
.notes i{font-style:italic;color:var(--muted);}

.metricbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.6rem;
  padding:.15rem 0 .1rem;
}
.mb-label{
  font-family:var(--f-m);
  font-size:.66rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;}
.chips button{
  font-family:var(--f-m);
  font-size:.7rem;
  letter-spacing:.04em;
  padding:.38rem .7rem;
  background:var(--surface);
  border:1px solid var(--line-strong);
  color:var(--muted);
  cursor:pointer;
}
.chips button[aria-pressed="true"]{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--accent-tint);
}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.chips button .u{opacity:.7;}

.status{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.45rem;
  font-family:var(--f-m);
  font-size:.67rem;
  letter-spacing:.06em;
  color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted);}
.dot.live{background:#2C8A5E;}
.dot.demo{background:var(--crit);}

.unitline{font-family:var(--f-m);font-size:.68rem;color:var(--muted);letter-spacing:.05em;}
.kv.now dt{color:var(--accent);font-weight:600;}
#leg-mid{opacity:.75;}
</style>

<style>
.news{display:flex;flex-direction:column;}
.news-item{
  display:flex;
  flex-direction:column;
  gap:.28rem;
  padding:.62rem 0;
  border-bottom:1px solid var(--line);
  text-decoration:none;
  color:var(--ink);
}
.news-item:last-child{border-bottom:0;}
.news-item:hover .n-title{color:var(--accent);}
.news-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.n-title{font-size:.85rem;line-height:1.38;font-weight:500;}
.news-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.4rem;
  font-family:var(--f-m);
  font-size:.62rem;
  letter-spacing:.06em;
  color:var(--muted);
}
.news-meta .src{max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{
  font-family:var(--f-m);
  font-size:.58rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.1rem .32rem;
  border:1px solid currentColor;
}
.badge.policy{color:var(--deep);}
.badge.grid{color:var(--accent);}
.badge.press{color:var(--muted);}
.badge.geo{color:var(--ink);opacity:.6;}
.news-empty{font-size:.83rem;color:var(--muted);}

/* vue actualite plein ecran */
.newsgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(21rem,1fr));
  gap:1.1rem;
  align-items:start;
}
.newscard{
  background:var(--surface);
  border:1px solid var(--line);
  padding:.9rem 1.1rem 1rem;
  display:flex;
  flex-direction:column;
  gap:.5rem;
}
.newscard > h3{
  font-family:var(--f-m);
  font-size:.64rem;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0;
}
.sel{
  font-family:var(--f-m);
  font-size:.72rem;
  padding:.36rem .5rem;
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line-strong);
}
.sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>

</head>
<body>
<div class="app">

<header class="top">
  <div>
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="sub"></p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Vue / View">
      <button type="button" id="v-map" aria-pressed="true" data-i18n="viewMap"></button>
      <button type="button" id="v-news" aria-pressed="false" data-i18n="viewNews"></button>
    </div>
    <div class="seg" role="group" aria-label="Langue / Language">
      <button type="button" id="b-fr" aria-pressed="true">FR</button>
      <button type="button" id="b-en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<!-- ============================ VUE CARTE ============================ -->
<section id="view-map">

  <div class="toolbar">
    <div class="seg" id="grp" role="group" aria-label="Énergie / Commodity"></div>
    <div class="metricbar">
      <span class="mb-label" data-i18n="colorBy"></span>
      <div class="chips" id="mets" role="group" aria-label="Métrique / Metric"></div>
    </div>
  </div>

  <div class="status">
    <span class="dot" id="s-dot"></span>
    <span id="s-text"></span>
  </div>

  <div class="stage">
    <div>
      <div class="mapbox">
        <div class="tip" id="tip" role="status" aria-live="polite"></div>
        <svg class="map" id="map" viewBox="0 0 820 720" role="img" aria-label="Europe"></svg>
      </div>
      <div class="legend">
        <span id="leg-label"></span>
        <div class="ramp" id="ramp"></div>
        <span id="leg-min">—</span>
        <span id="leg-mid"></span>
        <span id="leg-max">—</span>
        <span style="margin-left:auto" data-i18n="legendGrey"></span>
      </div>
    </div>

    <aside class="panel">
      <div class="p-head">
        <span class="eyebrow" id="p-eyebrow"></span>
        <h2 id="p-name"></h2>
      </div>
      <div class="p-body" id="p-body"></div>
    </aside>
  </div>

  <div class="detail" id="detail" hidden></div>
</section>

<!-- ========================== VUE ACTUALITÉ ========================== -->
<section id="view-news" hidden>

  <div class="toolbar">
    <div class="metricbar">
      <span class="mb-label" data-i18n="filterTheme"></span>
      <div class="chips" id="n-themes" role="group"></div>
    </div>
    <div class="metricbar">
      <span class="mb-label" data-i18n="filterCountry"></span>
      <select id="n-country" class="sel"></select>
    </div>
  </div>

  <div class="status">
    <span class="dot" id="n-dot"></span>
    <span id="n-text"></span>
  </div>

  <div class="newsgrid" id="newsgrid"></div>
</section>

<footer>
  <span data-i18n="foot1"></span>
  <span data-i18n="foot2"></span>
  <span data-i18n="foot3"></span>
</footer>

</div>

// Sequentiel : une seule teinte, clair vers fonce.
const SEQ_L = ["#F7E8D2","#EFD0A0","#E2B36B","#D0913C","#B06F18"];
const SEQ_D = ["#3A2E1C","#5C4522","#87642A","#B4883A","#E0A44B"];
// Divergent : deux teintes, gris neutre au point milieu.
const DIV_L = ["#17636B","#8FB9BD","#DCDFDD","#E5B877","#B06F18"];
const DIV_D = ["#6FBAC4","#33707A","#3B4845","#8E6B2C","#E8AE55"];

const CCY = {EUR:"€/MWh", GBP:"£/MWh"};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const tip = document.getElementById("tip");

let group = "power";
let metric = "price";
let selected = null;
let live = null;
let news = null;
let view = "map";
let nTheme = "all";
let nCountry = "all";
let lang = "fr";

function t(){ return T[lang]; }
function m(){ return METRICS[metric]; }

function initLang(){
  const h = (location.hash || "").replace("#", "").toLowerCase();
  if (h === "en" || h === "fr") return h;
  return (navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr";
}

function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a === "dark") return true;
  if (a === "light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ramp(){
  if (m().scale === "div") return isDark() ? DIV_D : DIV_L;
  return isDark() ? SEQ_D : SEQ_L;
}

function unitOf(key, code){
  if (key === "price"){
    let c = (META[code] && META[code].ccy) || "EUR";
    if (live && live.metrics && live.metrics.price && live.metrics.price[code]
        && live.metrics.price[code].currency){
      c = live.metrics.price[code].currency;
    }
    return CCY[c] || (c + "/MWh");
  }
  return METRICS[key].unit;
}

function valueOf(key, code){
  if (live){
    const src = (live.metrics || {})[key];
    if (src && src[code] && typeof src[code].value === "number") return src[code].value;
    return null;
  }
  const d = DEMO[code];
  if (!d || typeof d[key] !== "number") return null;
  return d[key];
}

function val(code){ return valueOf(metric, code); }

function values(){
  return Object.keys(META).map(val).filter(v => typeof v === "number");
}

function domain(){
  const vs = values();
  if (!vs.length) return [0, 0];
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (m().scale === "div"){
    const a = Math.max(Math.abs(lo), Math.abs(hi)) || 1;
    return [-a, a];
  }
  return [lo, hi];
}

function colorFor(code){
  const v = val(code);
  if (typeof v !== "number") return "var(--land)";
  const [lo, hi] = domain();
  const k = hi === lo ? 0.5 : (v - lo) / (hi - lo);
  const r = ramp();
  return r[Math.min(r.length - 1, Math.max(0, Math.floor(k * r.length)))];
}

<script>
/* ------------------------------------------------------------------ carte */

function build(){
  svg.textContent = "";
  const g = document.createElementNS(NS, "g");
  for (const code in PATHS){
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", PATHS[code]);
    p.dataset.code = code;
    if (META[code]){
      p.classList.add("live");
      p.setAttribute("tabindex", "0");
      p.setAttribute("role", "button");
    }
    g.appendChild(p);
  }
  svg.appendChild(g);
}

function renderControls(){
  const gr = document.getElementById("grp");
  gr.textContent = "";
  Object.keys(GROUPS).forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = GROUPS[k][lang];
    b.setAttribute("aria-pressed", String(k === group));
    b.addEventListener("click", () => setGroup(k));
    gr.appendChild(b);
  });

  const mb = document.getElementById("mets");
  mb.textContent = "";
  ORDER.filter(k => METRICS[k].group === group).forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    const n = document.createElement("span");
    n.textContent = METRICS[k][lang] + " ";
    const u = document.createElement("span");
    u.className = "u";
    u.textContent = "(" + METRICS[k].unit + ")";
    b.append(n, u);
    b.setAttribute("aria-pressed", String(k === metric));
    b.addEventListener("click", () => setMetric(k));
    mb.appendChild(b);
  });
}

function paint(){
  svg.querySelectorAll("path").forEach(p => {
    p.style.fill = colorFor(p.dataset.code);
    p.classList.toggle("sel", p.dataset.code === selected);
    const c = META[p.dataset.code];
    if (c) p.setAttribute("aria-label", c.name[lang]);
  });
  const [lo, hi] = domain();
  const u = m().unit;
  document.getElementById("leg-min").textContent = lo.toFixed(1) + " " + u;
  document.getElementById("leg-mid").textContent = m().scale === "div" ? "0" : "→";
  document.getElementById("leg-max").textContent = hi.toFixed(1) + " " + u;
  document.getElementById("leg-label").textContent = m()[lang];
  const rmp = document.getElementById("ramp");
  rmp.textContent = "";
  ramp().forEach(c => {
    const i = document.createElement("i");
    i.style.background = c;
    rmp.appendChild(i);
  });
}

function showTip(code, evt){
  const c = META[code];
  if (!c) return;
  const box = svg.closest(".mapbox").getBoundingClientRect();
  const v = val(code);
  tip.textContent = "";
  const n = document.createElement("div");
  n.className = "t-name"; n.textContent = c.name[lang];
  const z = document.createElement("div");
  z.className = "t-row";
  z.textContent = group === "power" ? c.zone : (c.hub || t().noHub);
  const p = document.createElement("div");
  p.className = "t-row";
  p.textContent = typeof v === "number"
    ? v.toFixed(2) + " " + unitOf(metric, code) : t().noData;
  tip.append(n, z, p);
  tip.style.left = (evt.clientX - box.left) + "px";
  tip.style.top = (evt.clientY - box.top - 6) + "px";
  tip.classList.add("on");
}
function hideTip(){ tip.classList.remove("on"); }

/* --------------------------------------------------------------- fabriques */

function row(k, v, active){
  const d = document.createElement("div");
  d.className = "kv" + (active ? " now" : "");
  const dt = document.createElement("dt"); dt.textContent = k;
  const dd = document.createElement("dd"); dd.textContent = v;
  d.append(dt, dd);
  return d;
}

function linkEl(label, url, note){
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  const s = document.createElement("span"); s.textContent = label;
  const e = document.createElement("em");   e.textContent = note;
  a.append(s, e);
  return a;
}

function blockEl(title){
  const b = document.createElement("div");
  b.className = "block";
  const h = document.createElement("h3");
  h.textContent = title;
  b.appendChild(h);
  return b;
}

/* ------------------------------------------------------------- actualite */

function feed(){ return news || DEMO_NEWS; }
function feedIsDemo(){ return !news; }

function fmtDate(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 60) return Math.max(1, mins) + " min";
  if (mins < 1440) return Math.round(mins / 60) + " h";
  return d.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB",
                              {day: "2-digit", month: "short"});
}

function themeLabel(x){
  return x === "policy" ? t().tPolicy : (x === "grid" ? t().tGrid : t().tPress);
}

function newsItem(n, geo){
  const a = document.createElement("a");
  a.className = "news-item";
  a.href = n.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  const ti = document.createElement("div");
  ti.className = "n-title"; ti.textContent = n.title;
  const meta = document.createElement("div");
  meta.className = "news-meta";
  const b = document.createElement("span");
  b.className = "badge " + (n.theme || "press");
  b.textContent = themeLabel(n.theme);
  meta.appendChild(b);
  if (geo){
    const g = document.createElement("span");
    g.className = "badge geo"; g.textContent = geo;
    meta.appendChild(g);
  }
  const src = document.createElement("span");
  src.className = "src"; src.textContent = n.source || "";
  const dt = document.createElement("span");
  dt.textContent = fmtDate(n.date);
  meta.append(src, dt);
  a.append(ti, meta);
  return a;
}

function countryNews(code){
  return ((feed().countries || {})[code]) || [];
}

/* ------------------------------------------------------- panneau + detail */

function renderPanel(){
  const body = document.getElementById("p-body");
  body.textContent = "";

  if (!selected){
    document.getElementById("p-eyebrow").textContent = t().selection;
    document.getElementById("p-name").textContent = t().noCountry;
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = t().empty;
    body.appendChild(p);
    return;
  }

  const c = META[selected];
  document.getElementById("p-eyebrow").textContent = group === "power"
    ? (t().zonePrefix + " " + c.zone)
    : (c.hub ? (t().hubPrefix + " " + c.hub) : t().noHubLong);
  document.getElementById("p-name").textContent = c.name[lang];

  const b1 = blockEl(m()[lang]);
  const big = document.createElement("div");
  big.className = "big";
  const v = val(selected);
  const bb = document.createElement("b");
  bb.textContent = typeof v === "number" ? v.toFixed(2) : "—";
  const sp = document.createElement("span");
  sp.textContent = unitOf(metric, selected);
  big.append(bb, sp);
  b1.appendChild(big);
  if (!live){
    const tag = document.createElement("span");
    tag.className = "demo-tag"; tag.textContent = t().fake;
    b1.appendChild(tag);
  }
  const hint = document.createElement("div");
  hint.className = "unitline";
  hint.textContent = lang === "fr" ? m().hintFr : m().hintEn;
  b1.appendChild(hint);

  const b2 = blockEl(t().today);
  ORDER.forEach(k => {
    const x = valueOf(k, selected);
    if (typeof x !== "number") return;
    b2.appendChild(row(METRICS[k][lang], x.toFixed(2) + " " + unitOf(k, selected),
                       k === metric));
  });

  const b3 = blockEl(t().refs);
  b3.append(row(t().kZone, c.zone), row(t().kSpot, c.spot),
            row(t().kHub, c.hub || "—"), row(t().kEic, c.eic || "—"));

  body.append(b1, b2, b3);
}

function renderDetail(){
  const box = document.getElementById("detail");
  box.textContent = "";
  if (!selected){ box.hidden = true; return; }
  box.hidden = false;

  const c = META[selected];

  const b1 = blockEl(t().specifics);
  const ul = document.createElement("ul");
  ul.className = "notes";
  ((c.notes && c.notes[lang]) || []).forEach(x => {
    const li = document.createElement("li");
    li.innerHTML = x;
    ul.appendChild(li);
  });
  b1.appendChild(ul);

  const b2 = blockEl(t().linksBlock);
  const l = document.createElement("div");
  l.className = "links";
  (c.tso || []).forEach(s => l.appendChild(linkEl(s[0], s[1], s[2][lang])));
  l.appendChild(linkEl(t().eexPower, "https://www.eex.com/en/markets/power/power-derivatives", t().lSettlement));
  if (c.hub) l.appendChild(linkEl(t().eexGas, "https://www.eex.com/en/markets/natural-gas", t().lSettlement));
  l.appendChild(linkEl(t().entsoe, "https://transparency.entsoe.eu/", t().lOpen));
  if (c.agsi) l.appendChild(linkEl(t().agsi, "https://agsi.gie.eu/", t().lOpen));
  b2.appendChild(l);

  const b3 = blockEl(t().newsBlock);
  const rows = countryNews(selected);
  if (!rows.length){
    const p = document.createElement("p");
    p.className = "news-empty"; p.textContent = t().newsEmpty;
    b3.appendChild(p);
  } else {
    const list = document.createElement("div");
    list.className = "news";
    rows.forEach(n => list.appendChild(newsItem(n)));
    b3.appendChild(list);
  }

  box.append(b1, b2, b3);
}

/* ----------------------------------------------------------- vue actualite */

function allNews(){
  const out = [];
  (feed().world || []).forEach(n => out.push({n: n, code: null}));
  const cs = feed().countries || {};
  Object.keys(cs).forEach(code => cs[code].forEach(n => out.push({n: n, code: code})));
  out.sort((a, b) => (a.n.date < b.n.date ? 1 : -1));
  return out;
}

function renderNewsView(){
  // filtres thematiques
  const th = document.getElementById("n-themes");
  th.textContent = "";
  const themes = [["all", t().fAll], ["policy", t().tPolicy],
                  ["grid", t().tGrid], ["press", t().tPress]];
  themes.forEach(pair => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = pair[1];
    b.setAttribute("aria-pressed", String(nTheme === pair[0]));
    b.addEventListener("click", () => { nTheme = pair[0]; renderNewsView(); });
    th.appendChild(b);
  });

  // filtre pays
  const sel = document.getElementById("n-country");
  const keep = nCountry;
  sel.textContent = "";
  const opts = [["all", t().allCountries], ["world", t().worldOnly]];
  Object.keys(feed().countries || {}).sort((a, b) =>
    META[a] && META[b] ? META[a].name[lang].localeCompare(META[b].name[lang]) : 0
  ).forEach(code => {
    if (META[code]) opts.push([code, META[code].name[lang]]);
  });
  opts.forEach(pair => {
    const o = document.createElement("option");
    o.value = pair[0]; o.textContent = pair[1];
    if (pair[0] === keep) o.selected = true;
    sel.appendChild(o);
  });

  // grille
  const grid = document.getElementById("newsgrid");
  grid.textContent = "";
  let rows = allNews();
  if (nTheme !== "all") rows = rows.filter(r => (r.n.theme || "press") === nTheme);
  if (nCountry === "world") rows = rows.filter(r => !r.code);
  else if (nCountry !== "all") rows = rows.filter(r => r.code === nCountry);

  const perCard = 6;
  for (let i = 0; i < rows.length; i += perCard){
    const card = document.createElement("div");
    card.className = "newscard";
    const list = document.createElement("div");
    list.className = "news";
    rows.slice(i, i + perCard).forEach(r => {
      const geo = r.code && META[r.code] ? META[r.code].name[lang] : null;
      list.appendChild(newsItem(r.n, geo));
    });
    card.appendChild(list);
    grid.appendChild(card);
  }

  if (!rows.length){
    const p = document.createElement("p");
    p.className = "news-empty"; p.textContent = t().newsEmpty;
    grid.appendChild(p);
  }

  document.getElementById("n-dot").className = "dot " + (feedIsDemo() ? "demo" : "live");
  document.getElementById("n-text").textContent = feedIsDemo()
    ? t().newsOff : t().newsLive(rows.length);
}

/* ------------------------------------------------------------------ etats */

function status(cls, text){
  document.getElementById("s-dot").className = "dot " + cls;
  document.getElementById("s-text").textContent = text;
}

function refreshStatus(){
  if (live){
    let n = 0;
    Object.keys(live.metrics || {}).forEach(k => { n += Object.keys(live.metrics[k]).length; });
    status("live", t().liveOn(live.day, n));
  } else {
    status("demo", t().demoOn);
  }
}

function applyView(){
  document.getElementById("view-map").hidden = view !== "map";
  document.getElementById("view-news").hidden = view !== "news";
  document.getElementById("v-map").setAttribute("aria-pressed", String(view === "map"));
  document.getElementById("v-news").setAttribute("aria-pressed", String(view === "news"));
}

function redraw(){
  renderControls();
  paint();
  renderPanel();
  renderDetail();
  renderNewsView();
  refreshStatus();
  applyView();
}

function writeHash(){
  const h = "#" + lang + (view === "news" ? "/news" : "");
  if (history.replaceState) history.replaceState(null, "", h);
  else location.hash = h;
}

function setView(v){ view = v; writeHash(); applyView(); }
function setGroup(g){
  if (g === group) return;
  group = g;
  metric = ORDER.filter(k => METRICS[k].group === g)[0];
  redraw();
}
function setMetric(k){ metric = k; redraw(); }

function applyLang(){
  document.documentElement.setAttribute("lang", t().htmlLang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t()[el.dataset.i18n];
  });
  document.getElementById("b-fr").setAttribute("aria-pressed", String(lang === "fr"));
  document.getElementById("b-en").setAttribute("aria-pressed", String(lang === "en"));
  document.title = t().title;
  redraw();
}

function setLang(l){ lang = l; writeHash(); applyLang(); }

function readHash(){
  const raw = (location.hash || "").replace("#", "").toLowerCase();
  const parts = raw.split("/");
  if (parts[0] === "en" || parts[0] === "fr") lang = parts[0];
  else lang = (navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr";
  view = parts[1] === "news" ? "news" : "map";
}

/* ------------------------------------------------------------- evenements */

svg.addEventListener("mousemove", e => {
  const el = e.target.closest("path.live");
  if (el) showTip(el.dataset.code, e); else hideTip();
});
svg.addEventListener("mouseleave", hideTip);
svg.addEventListener("click", e => {
  const el = e.target.closest("path.live");
  if (el){ selected = el.dataset.code; paint(); renderPanel(); renderDetail(); }
});
svg.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("path.live");
  if (el){ e.preventDefault(); selected = el.dataset.code; paint(); renderPanel(); renderDetail(); }
});

document.getElementById("n-country").addEventListener("change", e => {
  nCountry = e.target.value;
  renderNewsView();
});
document.getElementById("v-map").addEventListener("click", () => setView("map"));
document.getElementById("v-news").addEventListener("click", () => setView("news"));
document.getElementById("b-fr").addEventListener("click", () => setLang("fr"));
document.getElementById("b-en").addEventListener("click", () => setLang("en"));
window.addEventListener("hashchange", () => { readHash(); applyLang(); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);

readHash();
build();
applyLang();

fetch("data/prices.json", {cache: "no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(j => {
    let n = 0;
    Object.keys(j.metrics || {}).forEach(k => { n += Object.keys(j.metrics[k]).length; });
    if (!n) throw new Error("empty");
    live = j;
    redraw();
  })
  .catch(() => refreshStatus());

fetch("data/news.json", {cache: "no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(j => {
    if (!(j.world || []).length && !Object.keys(j.countries || {}).length)
      throw new Error("empty");
    news = j;
    renderDetail();
    renderNewsView();
  })
  .catch(() => { renderNewsView(); });
</script>

</body>
</html>
