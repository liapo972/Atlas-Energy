<style>
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-d);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:1400px;
  margin:0 auto;
  padding:1.5rem 1.25rem 3rem;
  display:flex;
  flex-direction:column;
  gap:1.1rem;
}
.eyebrow{
  font-family:var(--f-m);
  font-size:.66rem;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}
header.top{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:1rem;
  padding-bottom:1rem;
  border-bottom:2px solid var(--ink);
}
h1{
  font-weight:800;
  font-size:clamp(1.6rem,4vw,2.35rem);
  letter-spacing:-.025em;
  line-height:1;
  margin:.35rem 0 0;
}
.sub{
  color:var(--muted);
  font-size:.9rem;
  max-width:34rem;
  margin:.5rem 0 0;
}
.banner{
  display:flex;
  align-items:flex-start;
  gap:.7rem;
  background:var(--surface);
  border:1px solid var(--crit);
  border-left-width:4px;
  padding:.8rem 1rem;
  font-size:.86rem;
  color:var(--ink);
}
.banner b{color:var(--crit);font-family:var(--f-m);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-top:.15rem;}
.banner p{margin:0;max-width:60rem;}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
  align-items:center;
}
.seg{
  display:inline-flex;
  border:1px solid var(--line-strong);
  background:var(--surface);
}
.seg button{
  font-family:var(--f-m);
  font-size:.7rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.5rem .9rem;
  background:none;
  border:0;
  color:var(--muted);
  cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line-strong);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
</style>
